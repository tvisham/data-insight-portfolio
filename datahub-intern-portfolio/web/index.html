<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataHub Ask</title>

    <!--
      Deliberately zero-build: React 18 + Babel standalone from a CDN.
      This keeps the demo runnable from a fresh clone with no `npm`.
      A real deployment would swap this for a Vite/Next.js build.
    -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      :root {
        color-scheme: light dark;
        --border: #d0d7de;
        --muted: #57606a;
        --accent: #0969da;
        --bg-code: #f6f8fa;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 32px;
        max-width: 900px;
        margin-inline: auto;
        line-height: 1.5;
      }
      h1 { margin-top: 0; }
      p.subtitle { color: var(--muted); margin-top: -8px; }
      textarea {
        width: 100%;
        min-height: 80px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        resize: vertical;
      }
      .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: white;
        cursor: pointer;
        font: inherit;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .examples { display: flex; gap: 6px; flex-wrap: wrap; }
      .examples button {
        background: white;
        color: var(--accent);
        font-size: 0.9em;
        padding: 4px 10px;
      }
      pre {
        background: var(--bg-code);
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
      }
      table { border-collapse: collapse; width: 100%; margin-top: 8px; }
      th, td {
        border-bottom: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
        font-size: 0.95em;
        vertical-align: top;
      }
      th { background: var(--bg-code); }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.8em;
        background: var(--bg-code);
        color: var(--muted);
      }
      .badge.llm { background: #fff2cc; color: #7a5c00; }
      .error { color: #cf222e; }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState } = React;

      // Prefilled prompts so a reviewer can click through quickly.
      const EXAMPLES = [
        "prereqs for CS 225",
        "which courses require CS 225",
        "how many courses in CS",
        "top 5 most cited works",
      ];

      function useAsk() {
        const [state, setState] = useState({ status: "idle" });

        async function ask(question) {
          setState({ status: "loading" });
          try {
            const resp = await fetch("/ask", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question }),
            });
            const body = await resp.json();
            if (!resp.ok) {
              setState({
                status: "error",
                error: body.detail || `HTTP ${resp.status}`,
              });
              return;
            }
            setState({ status: "ok", result: body });
          } catch (err) {
            setState({ status: "error", error: String(err) });
          }
        }

        return [state, ask];
      }

      // Auto-derive column headers from the first row.
      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) {
          return <p><em>No rows.</em></p>;
        }
        const cols = Object.keys(rows[0]);
        return (
          <table>
            <thead>
              <tr>{cols.map((c) => <th key={c}>{c}</th>)}</tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i}>
                  {cols.map((c) => (
                    <td key={c}>
                      {typeof r[c] === "object" && r[c] !== null
                        ? JSON.stringify(r[c])
                        : String(r[c] ?? "")}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        );
      }

      function App() {
        const [question, setQuestion] = useState(EXAMPLES[0]);
        const [state, ask] = useAsk();

        function submit(e) {
          e?.preventDefault?.();
          if (question.trim()) ask(question.trim());
        }

        return (
          <>
            <h1>DataHub · Ask</h1>
            <p className="subtitle">
              Tries the rule-based planner first; falls over to the LLM
              tool-call agent when the rules can't match. Same-origin POST
              to <code>/ask</code>.
            </p>

            <form onSubmit={submit}>
              <textarea
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
                placeholder="Ask a question about courses or works..."
              />
              <div className="row">
                <button type="submit" disabled={state.status === "loading"}>
                  {state.status === "loading" ? "Asking..." : "Ask"}
                </button>
                <div className="examples">
                  {EXAMPLES.map((q) => (
                    <button
                      key={q}
                      type="button"
                      onClick={() => { setQuestion(q); ask(q); }}
                    >
                      {q}
                    </button>
                  ))}
                </div>
              </div>
            </form>

            {state.status === "error" && (
              <p className="error"><strong>Error:</strong> {state.error}</p>
            )}

            {state.status === "ok" && (
              <section>
                <p>
                  <span
                    className={
                      "badge " + (state.result.source === "llm" ? "llm" : "")
                    }
                  >
                    source: {state.result.source}
                  </span>{" "}
                  {state.result.explanation}
                </p>
                <details open>
                  <summary>SQL</summary>
                  <pre>{state.result.sql}</pre>
                  {state.result.params && state.result.params.length > 0 && (
                    <pre>params: {JSON.stringify(state.result.params)}</pre>
                  )}
                </details>
                <h3>Rows ({state.result.rows.length})</h3>
                <ResultTable rows={state.result.rows} />
              </section>
            )}
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
